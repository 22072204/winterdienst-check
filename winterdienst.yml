name: Winterdienst-Check

on:
  schedule:
    # 2 Uhr und 19 Uhr UTC = 3 Uhr und 20 Uhr deutsche Winterzeit (CET)
    - cron: "0 2,19 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Starten über "Run workflow" zum Testen

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Winterdienst-Check ausführen
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python winterdienst_check.py
