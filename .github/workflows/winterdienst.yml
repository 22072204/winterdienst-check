name: Winterdienst-Check

on:
  schedule:
    # Cron läuft in UTC. Deutsche Winterzeit (CET) = UTC+1:
    #   18:55 UTC = 19:55 Uhr -> Abend-Check für morgen
    #   03:55 UTC = 04:55 Uhr -> Morgen-Check für heute (hier fällt die Entscheidung)
    # Bewusst nicht zur vollen Stunde, weil dort bei GitHub viele Workflows starten.
    - cron: "55 18 * * *"
    - cron: "55 3 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Starten über "Run workflow" zum Testen

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Winterdienst-Check ausführen
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python winterdienst_check.py
