name: Winterdienst-Check

# Der Start erfolgt NICHT mehr über den GitHub-Zeitplan (der war unpünktlich und hat Läufe ausfallen lassen),
# sondern pünktlich über cron-job.org, das diesen Workflow per GitHub-API anstößt:
#   19:55 Uhr -> Abend-Check für morgen
#   04:55 Uhr -> Morgen-Check für heute (hier fällt die Entscheidung)
# Manuell starten geht weiterhin über "Run workflow" (die Mail wird dann als "Manueller Lauf" markiert).
on:
  workflow_dispatch:
    inputs:
      quelle:
        description: "Wer startet den Lauf? (cron = automatisch über cron-job.org, sonst manuell)"
        required: false
        default: "manuell"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Winterdienst-Check ausführen
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QUELLE: ${{ inputs.quelle }}
        run: python winterdienst_check.py
